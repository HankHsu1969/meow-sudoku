<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="喵喵數獨">
<meta name="format-detection" content="telephone=no">
<title>喵喵數獨</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="preload" href="fonts/huninn-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ───────── 主畫面 ───────── -->
  <section id="screen-home" class="screen active">
    <div class="topbar">
      <button class="icon-btn" data-action="help" aria-label="遊戲說明"><svg><use href="#i-help"/></svg></button>
      <button class="icon-btn" data-action="settings" aria-label="設定"><svg><use href="#i-sliders"/></svg></button>
    </div>
    <div class="home-hero">
      <img class="hero-cat" src="img/cat_wave.png" alt="">
      <h1 class="logo"><span class="logo-a">喵喵</span><span class="logo-b">數獨</span></h1>
      <p class="tagline">和小貓一起挑戰 50 道謎題</p>
    </div>
    <div class="home-actions">
      <button class="btn btn-primary btn-big" data-action="play">
        <svg class="btn-ico"><use href="#i-paw"/></svg><span id="play-label">開始遊戲</span>
      </button>
      <button class="btn btn-light" data-action="levels"><svg class="btn-ico"><use href="#i-grid"/></svg>選擇關卡</button>
      <div class="home-stars"><svg class="star-ico"><use href="#i-star"/></svg><span id="home-stars">0 / 150</span></div>
    </div>
  </section>

  <!-- ───────── 關卡選擇 ───────── -->
  <section id="screen-levels" class="screen">
    <div class="topbar solid">
      <button class="icon-btn" data-action="home" aria-label="返回"><svg><use href="#i-back"/></svg></button>
      <h2 class="topbar-title">選擇關卡</h2>
      <div class="pill"><svg class="star-ico"><use href="#i-star"/></svg><span id="levels-stars">0</span></div>
    </div>
    <div class="levels-scroll" id="levels-list"></div>
  </section>

  <!-- ───────── 遊戲畫面 ───────── -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-action="levels" aria-label="返回關卡"><svg><use href="#i-back"/></svg></button>
      <div class="game-title">
        <div class="game-level" id="game-level">第 1 關</div>
        <div class="game-chapter" id="game-chapter">毛線球．入門</div>
      </div>
      <button class="icon-btn" data-action="pause" aria-label="暫停"><svg><use href="#i-pause"/></svg></button>
    </div>

    <div class="status-row">
      <div class="mascot">
        <img id="mascot-img" src="img/cat_think.png" alt="">
        <div class="bubble" id="bubble"></div>
      </div>
      <div class="status-right">
        <div class="pill timer"><svg><use href="#i-clock"/></svg><span id="timer">00:00</span></div>
        <div class="lives" id="lives" aria-label="剩餘機會"></div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="tools">
      <button class="tool" data-action="undo"><span class="tool-ico"><svg><use href="#i-undo"/></svg></span><span>復原</span></button>
      <button class="tool" data-action="erase"><span class="tool-ico"><svg><use href="#i-eraser"/></svg></span><span>擦除</span></button>
      <button class="tool" data-action="notes" id="tool-notes"><span class="tool-ico"><svg><use href="#i-pencil"/></svg><b class="badge" id="notes-badge">關</b></span><span>筆記</span></button>
      <button class="tool" data-action="hint" id="tool-hint"><span class="tool-ico"><svg><use href="#i-bulb"/></svg><b class="badge" id="hint-badge">3</b></span><span>提示</span></button>
    </div>

    <div class="numpad" id="numpad"></div>
  </section>

  <!-- ───────── 新手教學聚光燈 ───────── -->
  <div class="coach" id="coach">
    <div class="coach-hole" id="coach-hole"></div>
    <div class="coach-block"></div><div class="coach-block"></div><div class="coach-block"></div><div class="coach-block"></div>
    <svg class="coach-paw" id="coach-paw"><use href="#i-paw"/></svg>
    <div class="coach-card" id="coach-card"></div>
  </div>

  <!-- ───────── 彈出視窗 ───────── -->
  <div class="modal-layer" id="modal-layer">
    <div class="modal" id="modal"></div>
  </div>
  <div class="confetti" id="confetti"></div>
</div>

<!-- 圖示（可愛圓角線條風） -->
<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></g></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 114 2c-.9.6-1.6 1.1-1.6 2.3"/></g><circle cx="12" cy="17.2" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></g></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 15.6l9.6-9.6a2 2 0 012.8 0l3.6 3.6a2 2 0 010 2.8L12.4 19.6H7.6z"/><path d="M8.6 10.6l6.4 6.4M12.4 19.6H20"/></g></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L16 4.4a2 2 0 012.8 0l.8.8a2 2 0 010 2.8L8.8 18.8z"/><path d="M14 6.5l3.5 3.5"/></g></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0012 3z"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 3.5l8.5 7.5"/><path d="M6 9.5V20h12V9.5"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 11-2.2-5.3"/><path d="M19.5 4v5h-5"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 001.5.9l10-6.5a1 1 0 000-1.8l-10-6.5A1 1 0 008 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V5.5l10.5-2v12"/><circle cx="6.5" cy="17.5" r="2.7"/><circle cx="17" cy="15.5" r="2.7"/></g></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></g></symbol>
    <symbol id="i-vibrate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="7.5" y="3.5" width="9" height="17" rx="2.2"/><path d="M3.5 9v6M20.5 9v6"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><rect x="5.5" y="10.5" width="13" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.9l2.6 5.5 6 .8-4.4 4.1 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.1 6-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><g fill="currentColor"><path d="M12 11.2c-3.2 0-6.2 3.3-6.2 6 0 1.8 1.4 2.6 3 2.6 1.3 0 2-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3-.8 3-2.6 0-2.7-3-6-6.2-6z"/><ellipse cx="5.2" cy="10.4" rx="2" ry="2.5" transform="rotate(-18 5.2 10.4)"/><ellipse cx="9.1" cy="6.2" rx="2.1" ry="2.7" transform="rotate(-6 9.1 6.2)"/><ellipse cx="14.9" cy="6.2" rx="2.1" ry="2.7" transform="rotate(6 14.9 6.2)"/><ellipse cx="18.8" cy="10.4" rx="2" ry="2.5" transform="rotate(18 18.8 10.4)"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <!-- 章節圖示 -->
    <symbol id="i-yarn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="currentColor"/><g fill="none" style="stroke:var(--ico-detail,#fff)" stroke-width="1.5" stroke-linecap="round" opacity=".85"><path d="M5.5 8.5c4.5-.5 9.5 2.5 12 8.5"/><path d="M4.5 13c4-1 8 1 10.5 6.5"/><path d="M9 4c3 2 6.5 6 7.8 11.5"/></g></symbol>
    <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2.5 12c3-5 9.5-6.2 13.5-2.6L21 6l-1.6 6 1.6 6-5-3.4C12 18.2 5.5 17 2.5 12z" fill="currentColor"/><circle cx="7.6" cy="11" r="1.3" style="fill:var(--ico-detail,#fff)"/></symbol>
    <symbol id="i-scratch" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="3.5" fill="currentColor"/><g fill="none" style="stroke:var(--ico-detail,#fff)" stroke-width="1.6" stroke-linecap="round" opacity=".9"><path d="M9 7l-1.6 4.5M12.6 7L11 11.5M16.2 7l-1.6 4.5M10 13.5L8.4 18M13.6 13.5L12 18"/></g></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M4.5 19.5C4.5 10 10 4 20 4c0 10-6 15.5-15.5 15.5z" fill="currentColor"/><path d="M4.5 19.5L14 10" fill="none" style="stroke:var(--ico-detail,#fff)" stroke-width="1.6" stroke-linecap="round" opacity=".9"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8.5l4.6 4L12 5.5l4.4 7L21 8.5 19.2 19H4.8z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="15.5" r="1.5" style="fill:var(--ico-detail,#fff)"/></symbol>
  </defs>
</svg>

<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
